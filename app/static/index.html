<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1116">
<title>Jarvis</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c222b; --line: #262d36; --text: #e6e9ee;
    --muted: #8b95a3; --me: #2f6feb; --accent: #f0b429; --ok: #2ea043; --bad: #8b2f2f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  header { padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  header .sub { color: var(--muted); font-size: 13px; margin-left: auto; }
  #scroll { flex: 1; overflow-y: auto; padding: 14px 14px 20px; }

  /* dashboard cards */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .card-head h2 { font-size: 15px; margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card-head .meta { margin-left: auto; color: var(--muted); font-size: 12px; }
  .icon-btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 5px 10px; font-size: 13px; }
  .icon-btn:disabled { opacity: .5; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; scrollbar-width: none; }
  .chip { flex: none; background: var(--panel2); color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 11px; font-size: 13px; }
  .chip.on { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .mail { padding: 10px 2px; border-top: 1px solid var(--line); }
  .mail:first-child { border-top: 0; }
  .mail .top { display: flex; gap: 8px; font-size: 14px; }
  .mail .from { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail .when { margin-left: auto; color: var(--muted); flex: none; font-size: 12px; }
  .mail .subj { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail .sum { font-size: 14px; margin-top: 2px; }
  .ev { display: flex; gap: 12px; padding: 8px 2px; border-top: 1px solid var(--line); }
  .ev:first-child { border-top: 0; }
  .ev .t { width: 72px; flex: none; color: var(--accent); font-variant-numeric: tabular-nums; font-size: 14px; }
  .ev .loc { color: var(--muted); font-size: 13px; }
  .empty-note { color: var(--muted); font-size: 14px; padding: 4px 2px; }

  /* chat */
  .chat-title { color: var(--muted); font-size: 15px; text-transform: uppercase; letter-spacing: .06em; margin: 22px 2px 10px; }
  #log { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .assistant { background: var(--panel); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 5px; }
  .user { background: var(--me); align-self: flex-end; border-bottom-right-radius: 5px; }
  .msg a { color: #79b8ff; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button { flex: 1; border: 0; border-radius: 10px; padding: 8px; font-weight: 600; color: #fff; }
  .confirm { background: var(--ok); } .reject { background: var(--bad); }
  .status { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .typing { color: var(--muted); font-size: 14px; align-self: flex-start; }

  form { display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    border-top: 1px solid var(--line); background: var(--bg); }
  #input { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 20px; padding: 10px 14px; font-size: 16px; outline: none; }
  #send { background: var(--accent); color: #111; border: 0; border-radius: 20px; padding: 0 16px; font-weight: 700; }
  #gate { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column;
    justify-content: center; padding: 24px; gap: 12px; }
  #gate input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 16px; }
  #gate button { background: var(--accent); border: 0; border-radius: 12px; padding: 12px; font-weight: 700; }
</style>
</head>
<body>
<header><span class="dot"></span><h1>Jarvis</h1><span class="sub" id="conn"></span></header>

<div id="scroll">
  <section class="card">
    <div class="card-head">
      <h2>Inbox</h2>
      <span class="meta" id="mailMeta"></span>
      <button class="icon-btn" id="refreshBtn">↻ Refresh</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="mails"><div class="empty-note">Loading…</div></div>
  </section>

  <section class="card">
    <div class="card-head"><h2 id="tmrTitle">Tomorrow</h2></div>
    <div id="events"><div class="empty-note">Loading…</div></div>
  </section>

  <div class="chat-title">Chat</div>
  <div id="log"></div>
</div>

<form id="form" autocomplete="off">
  <input id="input" placeholder="Ask Jarvis…" enterkeyhint="send">
  <button id="send" type="submit">Send</button>
</form>

<div id="gate">
  <h2 style="margin:0">Unlock Jarvis</h2>
  <p style="color:var(--muted);margin:0">Paste the APP_TOKEN from your server's .env. It's saved on this phone only.</p>
  <input id="tokenInput" type="password" placeholder="App token">
  <button id="tokenSave">Unlock</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const scroller = $('scroll'), log = $('log');
let token = '';
try { token = localStorage.getItem('jarvis_token') || ''; } catch (e) {}
let dash = null, activeInbox = 0, lastChat = '', busy = false;
try { activeInbox = +localStorage.getItem('jarvis_inbox') || 0; } catch (e) {}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function md(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">link ↗</a>');
}
function ago(iso) {
  if (!iso) return '';
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function timeOf(start) {
  if (!start.includes('T')) return 'All day';
  return new Date(start).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(opts.headers || {}) } });
  if (r.status === 401) { showGate(); throw new Error('unauthorized'); }
  return r.json();
}

/* ---------- dashboard (reads the database only; no AI) ---------- */
function inboxLabel(addr) {
  const domain = (addr.split('@')[1] || '').toLowerCase();
  if (domain === 'gmail.com') return 'Gmail';
  if (domain.endsWith('umd.edu')) return 'UMD';
  return addr.split('@')[0];
}
function renderDash() {
  if (!dash) return;
  const boxes = dash.inboxes || [];
  if (activeInbox >= boxes.length) activeInbox = 0;
  $('chips').innerHTML = boxes.map((b, i) =>
    `<button class="chip ${i === activeInbox ? 'on' : ''}" data-i="${i}" title="${esc(b.account)}">${esc(inboxLabel(b.account))}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    activeInbox = +c.dataset.i;
    try { localStorage.setItem('jarvis_inbox', activeInbox); } catch (e) {}
    renderDash();
  });

  const box = boxes[activeInbox];
  if (!boxes.length) $('mails').innerHTML = '<div class="empty-note">No inboxes set up (IMAP_ACCOUNTS in .env).</div>';
  else if (box.error && !box.items.length) $('mails').innerHTML = `<div class="empty-note">⚠️ ${esc(box.error)}</div>`;
  else if (!box.items.length) $('mails').innerHTML = '<div class="empty-note">Nothing yet. Checking your inbox…</div>';
  else $('mails').innerHTML = box.items.map(m => `
      <div class="mail">
        <div class="top"><span class="from">${esc(m.sender)}</span><span class="when">${ago(m.sent_at)}</span></div>
        <div class="subj">${esc(m.subject)}</div>
        <div class="sum">${esc(m.summary)}</div>
      </div>`).join('');
  $('mailMeta').textContent = dash.refreshed_at ? 'updated ' + ago(dash.refreshed_at) : '';

  const t = dash.tomorrow || { events: [] };
  $('tmrTitle').textContent = 'Tomorrow · ' + (t.date || '');
  $('events').innerHTML = t.events.length ? t.events.map(e => `
      <div class="ev"><span class="t">${timeOf(e.start)}</span>
        <div><div>${esc(e.summary)}</div>${e.location ? `<div class="loc">${esc(e.location)}</div>` : ''}</div></div>`).join('')
    : '<div class="empty-note">Nothing scheduled. 🎉</div>';
}

async function loadDash() {
  if (!token) return;
  try { dash = await api('/api/dashboard'); renderDash(); $('conn').textContent = ''; }
  catch (e) { if (e.message !== 'unauthorized') $('conn').textContent = 'offline'; }
}

$('refreshBtn').onclick = async () => {
  const b = $('refreshBtn'); b.disabled = true; b.textContent = 'Checking…';
  try { await api('/api/refresh', { method: 'POST' }); await loadDash(); }
  finally { b.disabled = false; b.textContent = '↻ Refresh'; }
};

/* ---------- chat ---------- */
function renderChat(msgs, typing = false) {
  const key = JSON.stringify(msgs) + typing;
  if (key === lastChat) return;
  lastChat = key;
  const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
  log.innerHTML = msgs.length ? '' : '<div class="empty-note">Ask about your day, your classes, or your email.</div>';
  for (const m of msgs.slice(-30)) {
    const d = document.createElement('div');
    d.className = 'msg ' + m.role;
    d.innerHTML = md(m.content);
    if (m.action_id) {
      if (m.action_status === 'pending') {
        const a = document.createElement('div');
        a.className = 'actions';
        a.innerHTML = '<button class="confirm">Confirm</button><button class="reject">Skip</button>';
        a.querySelector('.confirm').onclick = () => decide(m.action_id, 'confirm');
        a.querySelector('.reject').onclick = () => decide(m.action_id, 'reject');
        d.appendChild(a);
      } else {
        const s = document.createElement('div');
        s.className = 'status';
        s.textContent = { done: 'Added ✓', rejected: 'Skipped', failed: 'Failed' }[m.action_status] || '';
        d.appendChild(s);
      }
    }
    log.appendChild(d);
  }
  if (typing) { const t = document.createElement('div'); t.className = 'typing'; t.textContent = 'Jarvis is thinking…'; log.appendChild(t); }
  if (typing || nearBottom) scroller.scrollTop = scroller.scrollHeight;
}

async function loadChat() {
  if (!token || busy) return;
  try { renderChat(await api('/api/messages')); } catch (e) {}
}
async function decide(id, decision) { await api(`/api/actions/${id}/${decision}`, { method: 'POST' }); loadChat(); }

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const input = $('input'), text = input.value.trim();
  if (!text || busy) return;
  input.value = ''; busy = true;
  const current = await api('/api/messages').catch(() => []);
  renderChat([...current, { role: 'user', content: text }], true);
  try { await api('/api/chat', { method: 'POST', body: JSON.stringify({ text }) }); }
  finally { busy = false; await loadChat(); scroller.scrollTop = scroller.scrollHeight; }
};

/* ---------- auth + polling ---------- */
function showGate() { $('gate').style.display = 'flex'; }
$('tokenSave').onclick = () => {
  token = $('tokenInput').value.trim();
  try { localStorage.setItem('jarvis_token', token); } catch (e) {}
  $('gate').style.display = 'none'; lastChat = '';
  loadDash(); loadChat();
};

if (!token) showGate();
loadDash(); loadChat();
setInterval(loadChat, 5000);     // database read only
setInterval(loadDash, 60000);    // database read only
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadDash(); loadChat(); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
